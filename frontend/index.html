<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zucchini — A multilingual AI assistant supporting English, Hindi, and Hinglish, powered by RAG and LangGraph." />
    <title>Zucchini — Multilingual Intelligence Assistant</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('zucchini-theme');
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
